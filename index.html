:root{--page:#404b64;--card:#fff9ed;--ink:#130303;--navy:#0f1b48;--pink:#e34874;--hl:#e34874;--hl-shadow:#a9206a;--chip:#dce6ff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--page:#2a3144}}
html,body{margin:0;min-height:100%}
body{background:var(--page);font-family:"Whitney HTF","Helvetica Neue",Arial,sans-serif;display:flex;justify-content:center;color:var(--ink)}
.sheet{background:var(--card);width:100%;max-width:402px;min-height:100vh;margin-top:40px;border-radius:20px 20px 0 0;text-align:center;padding:60px 0 40px;box-sizing:border-box;touch-action:none;user-select:none;-webkit-user-select:none}
h1{font-size:34px;line-height:40px;font-weight:500;margin:0;color:#130303}
h2{font-size:16px;line-height:19px;font-weight:700;letter-spacing:0;margin:9px 0 0;color:#130303}
.stage{position:relative;width:199px;height:242px;margin:115px auto 0}
.bubble{position:absolute;top:-41px;width:120px;height:102px;background:var(--chip);border-radius:10px;transition:left .18s ease}
.bubble:after{content:"";position:absolute;left:50%;bottom:-9px;margin-left:-9px;border:9px solid transparent;border-bottom:0;border-top-color:var(--chip)}
.bubble .iso{height:58px;margin-top:8px}
.bubble .iso svg{display:block;margin:0 auto;overflow:visible}
.bubble .nm{font-family:"Cambay",sans-serif;font-weight:700;font-size:19px;line-height:22px;margin-top:4px;white-space:pre;color:#000}
.bubble .nm b{color:var(--pink);font-weight:700}
.word{position:absolute;left:0;top:83px;width:199px;height:auto;overflow:visible}
.L .fl path{fill:var(--ink);transition:fill .15s}
.L .sd{display:none}
.L.on .fl path{fill:var(--hl)}
.L.on .fl path:not(.ns){filter:url(#sh)}
.L.on .sd{display:block;fill:var(--hl-shadow);opacity:.4}
.track{position:absolute;left:8px;top:267px;width:184px;height:12px;cursor:pointer}
.line{position:absolute;left:35.3px;width:125.4px;top:5px;height:2px;background:#444}
.tick{position:absolute;z-index:1;top:1px;width:3px;height:10px;margin-left:-1.5px;border-radius:2px;background:var(--pink)}
.head{position:absolute;z-index:2;top:-16px;left:0;width:44px;height:44px;margin-left:-22px;border-radius:50%;background:var(--navy);cursor:grab;touch-action:none}
.head.drag{cursor:grabbing;transform:scale(1.08)}
.head{-webkit-tap-highlight-color:transparent}
/* invisible, larger touch areas: the head looks the same but is about 56px to grab; the track strip is about 44px tall to tap */
.head::before{content:"";position:absolute;inset:-6px;border-radius:50%}
.track::before{content:"";position:absolute;left:-12px;right:-12px;top:-16px;bottom:-16px}
.listen{position:relative;display:block;width:55px;height:46px;margin:104px auto 0;padding:0;border:0;border-radius:34px;background:var(--chip);cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .12s ease}
.listen:active{transform:scale(.95)}
.listen svg{position:absolute;left:12.54px;top:10.54px;width:30px;height:29px;overflow:visible}
.listen .w{transition:opacity .15s}
.listen.playing .w{animation:pulse .7s ease-in-out infinite}
.listen.playing .w2{animation-delay:.12s}
.listen.playing .w3{animation-delay:.24s}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
.note{height:18px;margin-top:10px;font-size:12px;color:#6a6a6a}
</style>
</head>

      tick(x,nx);
      x=nx;
      if(Math.abs(target-x)<0.15&&Math.abs(v)<4){x=target;v=0;ping(nearest(target),0);target=null}
    }
    render();
    if(dragging||target!==null)raf=requestAnimationFrame(step);else raf=null;
  }
  function run(){if(!raf){lastT=performance.now();raf=requestAnimationFrame(step)}}

  function localX(e){var r=track.getBoundingClientRect();return e.clientX-r.left}

  head.addEventListener("pointerdown",function(e){
    audio();dragging=true;target=null;v=0;hist=[];
    anchorIdx=nearest(x);
    grabDX=x-localX(e);head.classList.add("drag");
    head.setPointerCapture(e.pointerId);e.preventDefault();run();
  });
  head.addEventListener("pointermove",function(e){
    if(!dragging)return;
    var raw=clamp(localX(e)+grabDX),nx=resist(raw),now=performance.now();
    hist.push({x:nx,r:raw,t:now});
    while(hist.length>1&&now-hist[0].t>90)hist.shift();
    if(hist.length>1){var h0=hist[0];if(now>h0.t)anticipate(nx,(nx-h0.x)/((now-h0.t)/1000))}
    tick(x,nx);
    x=nx;
  });
  function release(){
    if(!dragging)return;
    dragging=false;head.classList.remove("drag");
    var vel=0;
    if(hist.length>1){var a=hist[0],b=hist[hist.length-1];if(b.t>a.t)vel=(b.r-a.r)/((b.t-a.t)/1000)}
    target=pickTarget(vel);
    v=(target-x)*vel>0?Math.max(-450,Math.min(450,vel*0.3)):0; // gentle, so it settles without overshooting the tick
    run();
  }
  head.addEventListener("pointerup",release);
  head.addEventListener("pointercancel",release);

  // tap the track to glide to the nearest tick
  track.addEventListener("pointerdown",function(e){
    if(e.target===head)return;
    audio();target=STOPS[nearest(clamp(localX(e)))];v=0;run();
  });

  // keyboard support
  head.tabIndex=0;head.setAttribute("role","slider");
  head.addEventListener("keydown",function(e){
    var i=nearest(x),n=i;
    if(e.key==="ArrowLeft")n=Math.min(STOPS.length-1,i+1);
    if(e.key==="ArrowRight")n=Math.max(0,i-1);
    if(n!==i){target=STOPS[n];v=0;run();e.preventDefault()}
  });

  // ---- Listen button: plays the word in Urdu ----
  // To use a recorded pronunciation, set AUDIO_SRC to an audio file or data URI. Otherwise the device's Urdu voice is used.
  var AUDIO_SRC=null,WORD_UR="\u06AF\u0631\u062F\u0634";
  var listen=document.getElementById("listen"),note=document.getElementById("note"),noteT=null;
  function say(m){note.textContent=m;clearTimeout(noteT);noteT=setTimeout(function(){note.textContent=""},3200)}
  function playing(on){listen.classList.toggle("playing",on)}
  var synth=window.speechSynthesis;
  if(synth){try{synth.getVoices();synth.addEventListener("voiceschanged",function(){})}catch(e){}}
  listen.addEventListener("click",function(){
    audio();
    if(AUDIO_SRC){
      var a=new Audio(AUDIO_SRC);a.onended=function(){playing(false)};playing(true);
      a.play().catch(function(){playing(false);say("Audio could not play")});return;
    }
    if(!synth){say("Audio is not available in this browser");return}
    var voice=synth.getVoices().filter(function(v){return /^ur/i.test(v.lang)})[0];
    if(!voice){say("No Urdu voice found on this device");return}
    synth.cancel();
    var u=new SpeechSynthesisUtterance(WORD_UR);u.voice=voice;u.lang=voice.lang;u.rate=.85;
    u.onend=u.onerror=function(){playing(false)};playing(true);synth.speak(u);
  });

  render();
})();
</script>
</body>
</html>
